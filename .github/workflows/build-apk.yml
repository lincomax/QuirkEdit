name: Build APK

on:
  workflow_dispatch:
  push:
    branches: [ master ]
    paths-ignore:
      - 'README.md'

permissions:
  contents: write

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          submodules: recursive

      - name: Setup Java
        uses: actions/setup-java@v6
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v6

      - name: Apply editor engine patches
        run: |
          for patch in patches/sora-editor-*.patch; do
            git -C sora-editor apply "../$patch"
          done

      - name: Setup signing key
        env:
          SIGNING_KEYSTORE: ${{ secrets.SIGNING_KEYSTORE }}
          SIGNING_PASSWORD: ${{ secrets.SIGNING_PASSWORD }}
        run: |
          if [ -z "$SIGNING_KEYSTORE" ] || [ -z "$SIGNING_PASSWORD" ]; then
            echo "::error::Add the SIGNING_KEYSTORE and SIGNING_PASSWORD secrets (Settings > Secrets and variables > Actions) before building."
            exit 1
          fi
          echo "$SIGNING_KEYSTORE" | tr -d ' \r\n' | base64 -d > app/keystore.jks
          # Check the keystore opens with the password, and find the key's name (alias).
          if ! LIST=$(keytool -list -keystore app/keystore.jks -storepass "$SIGNING_PASSWORD" 2>&1); then
            echo "::error::Keystore didn't open: $(echo "$LIST" | grep -i -m1 'error\|exception\|incorrect')"
            echo "::error::Check that SIGNING_PASSWORD matches the keystore and SIGNING_KEYSTORE is its full base64 text."
            exit 1
          fi
          ALIASES=$(echo "$LIST" | grep -E 'PrivateKeyEntry' | cut -d, -f1)
          echo "Keys found in keystore: $(echo $ALIASES)"
          if echo "$ALIASES" | grep -qx squickedit; then
            ALIAS=squickedit
          elif [ "$(echo "$ALIASES" | grep -c .)" = "1" ]; then
            ALIAS="$ALIASES"
          else
            echo "::error::No key named 'squickedit' in the keystore. Keys found: $(echo $ALIASES)"
            exit 1
          fi
          echo "Signing with key: $ALIAS"
          {
            echo "KEYSTORE_PATH=keystore.jks"
            echo "KEYSTORE_PASSWORD=$SIGNING_PASSWORD"
            echo "KEY_ALIAS=$ALIAS"
            echo "KEY_PASSWORD=$SIGNING_PASSWORD"
          } > local.properties

      - name: Set version from build number
        run: |
          # Every build gets a higher version, so ObtainX sees it as an update
          BASE=$(grep -oP 'versionName = "\K[0-9.]+' app/build.gradle.kts | sed 's/\.$//')
          VERSION="$BASE.${{ github.run_number }}"
          CODE=$((20000 + ${{ github.run_number }}))
          sed -i -E "s/versionCode = [0-9]+/versionCode = $CODE/" app/build.gradle.kts
          sed -i -E "s/versionName = \"[^\"]*\"/versionName = \"$VERSION\"/" app/build.gradle.kts
          grep -E "versionCode|versionName" app/build.gradle.kts
          echo "VERSION=$VERSION" >> "$GITHUB_ENV"

      - name: Build release APK (FOSS)
        run: |
          chmod +x gradlew
          ./gradlew :app:assembleFossRelease --no-configuration-cache

      - name: Upload APK
        uses: actions/upload-artifact@v7
        with:
          name: SquickEdit
          path: app/build/outputs/apk/foss/release/*.apk

      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          APK=$(ls app/build/outputs/apk/foss/release/*.apk | head -1)
          cp "$APK" "SquickEdit-v$VERSION.apk"
          git log -1 --format=%B > release-notes.txt
          gh release create "v$VERSION" "SquickEdit-v$VERSION.apk" \
            --title "SquickEdit v$VERSION" \
            --notes-file release-notes.txt \
            --target "$GITHUB_SHA"

      - name: Delete keystore
        if: always()
        run: rm -f app/keystore.jks local.properties
